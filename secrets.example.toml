# Streamlit Cloud: App settings -> Secrets (local: .streamlit/secrets.toml)
GROQ_API_KEY = "gsk_..."

# Long random text; used to hash OTPs and login tokens. Change it and never share it.
APP_SECRET = "put-a-long-random-string-here"

# ---- Email OTP (any SMTP: Gmail app-password, Brevo, Zoho, SendGrid SMTP...) ----
[smtp]
enabled = true
server = "smtp.gmail.com"
port = 587
email = "your-email@gmail.com"
password = "your-app-password"

# ---- Mobile OTP (Twilio SMS) ----
TWILIO_SID = "ACxxxxxxxx"
TWILIO_TOKEN = "xxxxxxxx"
TWILIO_FROM = "+1xxxxxxxxxx"

# Testing only: shows the OTP on screen when no email/SMS provider is set. Keep 0 in production.
DEV_SHOW_OTP = "0"

# "0" lets people use the app without logging in
REQUIRE_LOGIN = "1"

# Where user data is stored (SQLite). On Streamlit Cloud this is wiped on reboot, see notes.
# APP_DB_PATH = "data/app.db"
